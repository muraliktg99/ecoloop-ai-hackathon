<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <rect width="200" height="240" fill="#fef2f2" rx="16"/>
  <!-- Battery nub (+) -->
  <rect x="88" y="35" width="24" height="15" rx="3" fill="#991b1b" stroke="#7f1d1d" stroke-width="2"/>
  <!-- Battery cylinder -->
  <rect x="65" y="50" width="70" height="145" rx="8" fill="#dc2626" stroke="#b91c1c" stroke-width="3"/>
  <!-- Gold bottom band (-) -->
  <path d="M 65 155 L 135 155 L 135 187 Q 135 195 127 195 L 73 195 Q 65 195 65 187 Z" fill="#eab308"/>
  <!-- Plus and Minus icons -->
  <text x="100" y="85" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle">+</text>
  <text x="100" y="180" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#713f12" text-anchor="middle">−</text>
  <!-- Lightning bolt symbol -->
  <polygon points="102,95 90,118 100,118 97,138 112,112 101,112" fill="#fef08a"/>
  <!-- Hazard indicator -->
  <text x="100" y="222" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#991b1b" text-anchor="middle">DOMESTIC E-WASTE</text>
</svg>
