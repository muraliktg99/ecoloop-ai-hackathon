# apphosting.yaml — Firebase App Hosting configuration for Next.js 14
runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: GEMINI_MODEL
    value: gemini-2.5-flash
  - variable: ENABLE_DEMO_MODE
    value: "true"
  - variable: COLLECTOR_ADMIN_PIN
    value: "1234"
